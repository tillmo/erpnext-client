[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    offline: läuft ohne Netz; ERPNext-API wird durch FakeFrappeClient ersetzt
    online_read: braucht eine ERPNext-Instanz mit lesendem API-Zugriff (ERPNEXT_TEST_SERVER/KEY/SECRET)
    online_write: braucht eine ERPNext-TESTinstanz mit schreibendem Zugriff (zusätzlich ERPNEXT_TEST_WRITE=1)
    submit: bucht Dokumente (docstatus 1) auf der Testinstanz (zusätzlich ERPNEXT_TEST_ALLOW_SUBMIT=1)
filterwarnings =
    ignore::DeprecationWarning
