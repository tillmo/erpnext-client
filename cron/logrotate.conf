# Monthly rotation of the cron logs, run as the unprivileged user (no /etc/logrotate.d needed):
#   0 1 1 * * /usr/sbin/logrotate -s $HOME/.config/erpnext-client/logrotate.state $HOME/erpnext-client/cron/logrotate.conf
# Keeps twelve compressed months next to the log (vcard-export.log-2026-10.gz, ...).
"/home/docker/logs/vcard-export.log" {
    monthly
    rotate 12
    dateext
    dateformat -%Y-%m
    compress
    delaycompress
    missingok
    notifempty
    nocreate
}
