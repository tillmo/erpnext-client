[mypy]
# Aufruf: mypy   (oder ohne Installation: uvx mypy)
files = *.py, tests
exclude = (^|/)test/
explicit_package_bases = True
ignore_missing_imports = True
# Die Bibliotheken PySimpleGUI, easygui, jsondiff, jsoneditor, datefinder, anytree, plotly,
# google-cloud-documentai und reportlab liefern keine Typinformationen.
